[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-defs"
version = "0.0.2.dev0"
description = "Definitions for agent security: public rule sets and risk corpora, normalized, with their lineage attached."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yue Zhao" }]
keywords = ["agent", "security", "mcp", "definitions", "rules", "corpus"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
# One extra per source loader and per emitter. The core stays empty on purpose:
# there is no shared dependency floor across Cisco, MISP, PyRIT, garak and
# Guardrails, so the analogous number is zero.
sigma = ["PyYAML>=6.0"]
atr = ["PyYAML>=6.0"]
agent-audit-kit = []
ave = []
guardana = []
claude-code = []
dev = ["pytest>=7.0"]

[project.scripts]
agent-defs = "agent_defs.cli:main"

[project.urls]
Homepage = "https://github.com/yzhao062/agent-defs"

[tool.setuptools]
license-files = ["LICENSE", "THIRD-PARTY-NOTICES"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The refusal screen consults measured timings, so the measurement ships with
# the code that reads it. Without it the screen falls back to shape. The bundle
# ships for the same reason: the machine running the hook has neither the
# corpus nor a YAML parser, so a bundle it cannot find is four starter rules.
agent_defs = ["hazards.json", "bundle.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# An exception that escapes a thread reaches pytest as a warning, and a warning
# keeps the run green. That is how a test whose subject failed off the main
# thread reports a pass, which happened here twice: a worker launch that raised
# inside the supervisor, and a reader that died before it could observe anything.
# Promoted here rather than in one file, because the class is not confined to one
# and a suite that spawns workers has threads everywhere. Only this category is
# promoted; the suite carries unrelated deprecation warnings that a blanket
# ``error`` would turn into failures with nothing to fix.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
