[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-defs"
version = "0.0.2.dev0"
description = "Definitions for agent security: public rule sets and risk corpora, normalized, with their lineage attached."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yue Zhao" }]
keywords = ["agent", "security", "mcp", "definitions", "rules", "corpus"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
# One extra per source loader and per emitter. The core stays empty on purpose:
# there is no shared dependency floor across Cisco, MISP, PyRIT, garak and
# Guardrails, so the analogous number is zero.
sigma = ["PyYAML>=6.0"]
atr = ["PyYAML>=6.0"]
agent-audit-kit = []
ave = []
guardana = []
claude-code = []
dev = ["pytest>=7.0"]

[project.scripts]
agent-defs = "agent_defs.cli:main"

[project.urls]
Homepage = "https://github.com/yzhao062/agent-defs"

[tool.setuptools]
license-files = ["LICENSE", "THIRD-PARTY-NOTICES"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
